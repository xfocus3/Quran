name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 .ci/public_boundary.py
      - run: |
          python3 -m venv /tmp/quran-ci-tests
          /tmp/quran-ci-tests/bin/pip --disable-pip-version-check install -r .ci/requirements.txt
          /tmp/quran-ci-tests/bin/python -m unittest discover -s .ci/tests -v
